name: Velox CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking Velox project files..."

          test -f index.html
          test -f README.md

          echo "Required frontend files found."

      - name: Validate HTML structure
        run: |
          echo "Checking HTML structure..."

          grep -qi "<!DOCTYPE html>" index.html
          grep -qi "<html" index.html
          grep -qi "<head" index.html
          grep -qi "<body" index.html

          echo "HTML structure check passed."

      - name: Check backend files
        run: |
          if [ -f server.js ]; then
            echo "Backend server.js found."
          else
            echo "No server.js in repository root."
            echo "Frontend-only checks will continue."
          fi

  deploy:
    name: Deploy to Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not configured."
            exit 1
          fi

          curl --fail --request POST "$RENDER_DEPLOY_HOOK_URL"

          echo "Render deployment triggered successfully."
